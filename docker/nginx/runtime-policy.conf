# This file is included from nginx's http context. $uri is normalized by nginx.
limit_req_zone "$binary_remote_addr:$uri" zone=public_api_read:10m rate=10r/s;
limit_req_zone "$binary_remote_addr:$uri" zone=public_api_analytics:10m rate=5r/s;
limit_req_zone "$binary_remote_addr:$uri" zone=public_api_sensitive:10m rate=2r/s;
limit_req_status 429;
log_format newsletter_query_free '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
