server {
    listen 80;
    server_name localhost;

    error_log  /var/log/postportal/nginx_error.log;
    access_log /var/log/postportal/nginx_access.log;

    root /var/www/html;
    index index.php index.html index.htm;

    # Allow uploads up to 25MB (larger than the 20MB PHP validation)
    client_max_body_size 25M;

    # Security headers are repeated in locations with local add_header directives:
    # nginx 1.18 does not inherit parent add_header values in those locations.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;

    # =====================================================
    # Performance: Gzip Compression
    # =====================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/eot
        font/opentype
        font/otf
        font/ttf
        image/svg+xml;

    # =====================================================
    # Performance: Connection & Buffer Tuning
    # =====================================================
    keepalive_timeout 65;
    keepalive_requests 100;

    # Optimize sendfile for static content
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Defense in depth for historical web-root logs and common accidental exports.
    # Regex denials must precede static-asset regex locations: nginx uses the first match.
    location = /logs { return 404; }
    location ^~ /logs/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:nginx_(?:access|error)\.log|php_errors\.log|smtp\.log)$ { return 404; }
    location ~* \.(?:sql|bak|backup|old|orig|save|swp|tar|tar\.gz|tgz)$ { return 404; }

    # =====================================================
    # Static Assets: Long-term caching with versioning
    # =====================================================
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;
        access_log off;
    }

    # Uploads are data only: do not allow the generic PHP handler or symlinks.
    location ^~ /storage/uploads/ {
        disable_symlinks on from=$document_root;
        error_page 403 = @upload_not_found;
        if ($uri ~ (^|/)\.) { return 404; }
        if ($uri ~* \.(?:php(?:[3-8])?|phtml|phar)(?:\.|$)) { return 404; }
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;
    }

    location @upload_not_found { return 404; }

    # =====================================================
    # Cache Purge Endpoint (internal only, requires secret)
    # =====================================================
    location = /api/cache-purge {
        # Only allow local requests or those with correct header
        internal;
        # This is handled by PHP to purge cache
    }

    # =====================================================
    # Backup & Restore Endpoints: Large file support
    # =====================================================
    location ~ ^/api/admin/(backup|restore)\.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "log_errors=On\nerror_log=/var/log/postportal/php_errors.log\ndisplay_errors=Off";

        # Allow large file uploads for restore (500MB limit)
        client_max_body_size 500M;

        # Extended timeouts for backup/restore operations
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Disable buffering for streaming downloads
        fastcgi_buffering off;
        proxy_buffering off;

        # Explicitly disable caching
        fastcgi_cache off;
        add_header X-Cache-Status "BYPASS-BACKUP" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;
    }

    # =====================================================
    # API Endpoints: Never cache (dynamic data)
    # =====================================================
    location ^~ /api/ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "log_errors=On\nerror_log=/var/log/postportal/php_errors.log\ndisplay_errors=Off";

        # Explicitly disable caching for all API endpoints
        fastcgi_cache off;
        add_header X-Cache-Status "BYPASS-API" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;
    }

    # =====================================================
    # PHP with FastCGI Caching
    # =====================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "log_errors=On\nerror_log=/var/log/postportal/php_errors.log\ndisplay_errors=Off";

        # =====================================================
        # FastCGI Cache Configuration
        # =====================================================
        fastcgi_cache POSTCACHE;
        fastcgi_cache_valid 200 5m;           # Cache successful responses for 5 minutes
        fastcgi_cache_valid 301 302 1m;       # Cache redirects for 1 minute
        fastcgi_cache_valid any 0;            # Don't cache errors
        fastcgi_cache_methods GET HEAD;       # Only cache GET/HEAD requests
        fastcgi_cache_use_stale error timeout updating invalid_header;
        fastcgi_cache_lock on;                # Prevent cache stampede
        fastcgi_cache_lock_timeout 5s;

        # =====================================================
        # Cache Bypass Rules (dynamic content)
        # =====================================================
        # Bypass cache for:
        # - POST/PUT/DELETE requests (handled by fastcgi_cache_methods)
        # - Authenticated users (have PHPSESSID cookie)
        # - Admin pages (?page=admin)
        # - Login pages (?page=login)
        # - Requests with cache-control: no-cache header

        set $no_cache 0;

        # Bypass for authenticated users (session cookie present)
        if ($http_cookie ~* "PHPSESSID") {
            set $no_cache 1;
        }

        # Bypass for admin page
        if ($arg_page = "admin") {
            set $no_cache 1;
        }

        # Bypass for login page
        if ($arg_page = "login") {
            set $no_cache 1;
        }

        # Bypass if client requests no-cache
        if ($http_cache_control ~* "no-cache") {
            set $no_cache 1;
        }

        # Apply bypass rules
        fastcgi_cache_bypass $no_cache;
        fastcgi_no_cache $no_cache;

        # Add cache status header for debugging
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:" always;

        # Pass cache purge header to PHP for cache busting
        fastcgi_param HTTP_X_CACHE_PURGE $http_x_cache_purge;
    }

    # =====================================================
    # Default location
    # =====================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
