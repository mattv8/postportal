[www]
user = www-data
group = www-data

listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = yes
catch_workers_output = yes
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[APP_URL] = $APP_URL
env[APP_SECRET] = $APP_SECRET
env[AUTH_TYPE] = $AUTH_TYPE
env[MYSQL_HOST] = $MYSQL_HOST
env[MYSQL_DATABASE] = $MYSQL_DATABASE
env[MYSQL_USER] = $MYSQL_USER
env[MYSQL_PASSWORD] = $MYSQL_PASSWORD
env[DEBUG] = $DEBUG
env[SMARTY_DEBUG] = $SMARTY_DEBUG
env[TZ] = $TZ
env[DEMO_MODE] = $DEMO_MODE
env[RECAPTCHA_SITE_KEY] = $RECAPTCHA_SITE_KEY
env[RECAPTCHA_SECRET_KEY] = $RECAPTCHA_SECRET_KEY
env[OPENAI_API_KEY] = $OPENAI_API_KEY
env[SITE_TITLE] = $SITE_TITLE
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_value[disable_functions] = pcntl_alarm,pcntl_async_signals,pcntl_errno,pcntl_exec,pcntl_fork,pcntl_get_last_error,pcntl_getcpu,pcntl_getcpuaffinity,pcntl_getpriority,pcntl_setcpuaffinity,pcntl_setpriority,pcntl_signal,pcntl_signal_dispatch,pcntl_signal_get_handler,pcntl_sigprocmask,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_strerror,pcntl_unshare,pcntl_wait,pcntl_waitid,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifcontinued,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig
