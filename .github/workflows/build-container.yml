name: Build and Push Container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: hub.docker.visnovsky.us
  IMAGE_NAME: library/post-portal

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build and push candidate image
    if: github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
      - id: meta
        name: Set candidate tag
        run: |
          CANDIDATE_TAG="${REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          printf 'tag=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: build-and-push
        name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tag }}
      - name: Verify pushed digest
        env:
          POSTPORTAL_TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: bash tests/Security/Runtime/php-runtime-security.sh

  sign:
    name: Sign candidate digest
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    needs: [build-and-push]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.4.1'
      - uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Sign immutable image digest
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE_DIGEST"

  sbom:
    name: Generate SBOM
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    needs: [build-and-push]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-main
          path: sbom.spdx.json
          retention-days: 90

  promote:
    name: Promote verified candidate
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success' && needs.sign.result == 'success' && needs.sbom.result == 'success'
    needs: [build-and-push, sign, sbom]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
      - uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Reject a superseded main commit
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Promote the verified digest without rebuilding
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:main" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [ci, build-and-push, sign, sbom, promote]
    permissions:
      contents: read
    steps:
      - name: Report and enforce publication outcome
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          printf 'CI=%s build=%s sign=%s SBOM=%s promote=%s\n' "$CI_RESULT" "$BUILD_RESULT" "$SIGN_RESULT" "$SBOM_RESULT" "$PROMOTE_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CI_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$SIGN_RESULT" = success
          test "$SBOM_RESULT" = success
          test "$PROMOTE_RESULT" = success
