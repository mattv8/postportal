name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: postportal
          MARIADB_USER: postportal
          MARIADB_PASSWORD: ci-fixture-mysql-password-2026
          MARIADB_ROOT_PASSWORD: ci-fixture-root-password-2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: postportal
      MYSQL_USER: postportal
      MYSQL_PASSWORD: ci-fixture-mysql-password-2026
      DEFAULT_ADMIN_PASSWORD: ci-fixture-admin-password-2026
      APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none
      - run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client openssl python3 curl util-linux
          command -v python3 openssl curl setsid
          test "$(php -r 'echo PHP_VERSION_ID >= 80512 ? 1 : 0;')" = 1
          composer install --prefer-dist --no-progress --no-interaction
          mkdir -p src/cache src/templates_c var/phpstan
          chmod -R ugo+rwx src/cache src/templates_c var/phpstan
          MIGRATION_DIR="$GITHUB_WORKSPACE/migrations" bash docker/scripts/run-migrations.sh
          ./vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, gd, mysqli
          coverage: none
      - run: |
          test "$(php -r 'echo PHP_VERSION_ID >= 80512 ? 1 : 0;')" = 1
          composer install --prefer-dist --no-progress --no-interaction
          ./vendor/bin/phpstan analyse --error-format=github

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
      - run: |
          composer validate --strict
          composer audit --locked --no-interaction

  readme-consistency:
    name: README consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/sync-readme
        with:
          fail-on-diff: 'true'

  container-runtime:
    name: Container runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
      - name: Build production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: postportal-ci:production
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build development image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile.dev
          load: true
          tags: postportal-ci:development
          cache-from: type=gha
      - name: Verify production runtime
        run: |
          POSTPORTAL_TEST_IMAGE=postportal-ci:production bash tests/Security/Runtime/php-runtime-security.sh
          POSTPORTAL_TEST_IMAGE=postportal-ci:production bash tests/Security/Runtime/nginx-security-runtime.sh
          POSTPORTAL_TEST_IMAGE=postportal-ci:production bash tests/Security/Runtime/startup-security-test.sh
      - name: Verify development PHP runtime
        run: POSTPORTAL_TEST_IMAGE=postportal-ci:development bash tests/Security/Runtime/php-runtime-security.sh

  gate:
    name: gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [phpunit, phpstan, composer-audit, readme-consistency, container-runtime]
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
      - name: Exercise gate failure fixtures
        run: bash tests/Security/Runtime/ci-gate-test.sh
      - name: Require all CI checks to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci-gate.sh
